name: Annotator QA Public Preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      report_id:
        required: false
        type: string
      target_url:
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  ANNOTATE_API_URL: https://annotate-api-production.up.railway.app
  ANNOTATOR_QA_SCRIPT_REF: main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium

      - name: Build public preview
        env:
          VITE_ANNOTATE_PROJECT_KEY: ${{ vars.VITE_ANNOTATE_PROJECT_KEY }}
          VITE_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Deploy public preview to GitHub Pages branch
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          preview_dir="$RUNNER_TEMP/gh-pages"
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add "$preview_dir" origin/gh-pages
          else
            mkdir -p "$preview_dir"
            git -C "$preview_dir" init
            git -C "$preview_dir" checkout -b gh-pages
            git -C "$preview_dir" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          fi
          git -C "$preview_dir" remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p "$preview_dir/previews/$GITHUB_SHA"
          cp -R dist/. "$preview_dir/previews/$GITHUB_SHA/"
          touch "$preview_dir/.nojekyll"
          git -C "$preview_dir" config user.name "github-actions[bot]"
          git -C "$preview_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$preview_dir" add .nojekyll "previews/$GITHUB_SHA"
          git -C "$preview_dir" commit -m "Deploy preview $GITHUB_SHA" || true
          git -C "$preview_dir" push origin HEAD:gh-pages
          echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/previews/$GITHUB_SHA/" >> "$GITHUB_OUTPUT"

      - name: Download Annotator QA runner scripts
        run: |
          set -euo pipefail
          mkdir -p .annotator-qa
          base_url="https://raw.githubusercontent.com/ibrolord/annotator-qa-runner/${ANNOTATOR_QA_SCRIPT_REF}/scripts/qa"
          curl -fsSL "$base_url/resolve-report-id.mjs" -o .annotator-qa/resolve-report-id.mjs
          curl -fsSL "$base_url/run-verification.mjs" -o .annotator-qa/run-verification.mjs
          curl -fsSL "$base_url/comment-pr-verification.mjs" -o .annotator-qa/comment-pr-verification.mjs
          node --check .annotator-qa/resolve-report-id.mjs
          node --check .annotator-qa/run-verification.mjs
          node --check .annotator-qa/comment-pr-verification.mjs

      - name: Resolve Annotator report ID
        if: github.event_name != 'push'
        id: report
        env:
          ANNOTATE_REPORT_ID: ${{ inputs.report_id || '' }}
        run: node .annotator-qa/resolve-report-id.mjs

      - name: Resolve public target URL
        if: steps.report.outputs.report_found == 'true'
        id: target
        env:
          INPUT_TARGET_URL: ${{ inputs.target_url || '' }}
          PREVIEW_TARGET_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          target_url="${INPUT_TARGET_URL:-$PREVIEW_TARGET_URL}"
          case "$target_url" in
            http://localhost*|https://localhost*|http://127.*|https://127.*|http://0.0.0.0*|https://0.0.0.0*|http://[::1]*|https://[::1]*)
              echo "::error::Annotator QA requires a public preview URL reachable from GitHub-hosted runners."
              exit 1
              ;;
          esac
          echo "target_url=$target_url" >> "$GITHUB_OUTPUT"

      - name: Wait for public preview to serve this build
        if: steps.report.outputs.report_found == 'true'
        env:
          TARGET_URL: ${{ steps.target.outputs.target_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -fsSL "$TARGET_URL" | grep -q "$EXPECTED_SHA"; then
              echo "Public preview is serving $EXPECTED_SHA"
              exit 0
            fi
            echo "Waiting for public preview propagation: attempt $attempt/24"
            sleep 5
          done
          echo "::error::Public preview did not serve $EXPECTED_SHA at $TARGET_URL within 120 seconds."
          exit 1

      - name: Run Annotator QA verification
        if: steps.report.outputs.report_found == 'true'
        id: verification
        env:
          ANNOTATE_API_URL: ${{ env.ANNOTATE_API_URL }}
          ANNOTATE_RUNNER_TOKEN: ${{ secrets.ANNOTATOR_QA_RUNNER_TOKEN }}
          ANNOTATE_REPORT_ID: ${{ steps.report.outputs.report_id }}
          ANNOTATE_TARGET_URL: ${{ steps.target.outputs.target_url }}
          ANNOTATE_REPRO_BASE_URL: ${{ steps.target.outputs.target_url }}
          ANNOTATE_GIT_REF: ${{ github.sha }}
          ANNOTATE_REPO_DIR: ${{ github.workspace }}
        run: node .annotator-qa/run-verification.mjs

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request' && steps.report.outputs.report_found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANNOTATE_REPORT_ID: ${{ steps.report.outputs.report_id }}
          ANNOTATE_VERIFICATION_RUN_ID: ${{ steps.verification.outputs.verification_run_id }}
          ANNOTATE_VERIFICATION_STATUS: ${{ steps.verification.outputs.status || 'failed' }}
          ANNOTATE_VERIFICATION_SUMMARY: ${{ steps.verification.outputs.result_summary }}
        run: node .annotator-qa/comment-pr-verification.mjs
